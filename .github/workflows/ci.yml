name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  native-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build ScreenCaptureKit helper
        working-directory: native/macos/FramecastCapture
        run: swift build -c release

  e2e:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb xdotool
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a npm run test:e2e -w @framecast/desktop
